# Local infra for the snapmart-cms POC.
#   postgres -> Payload's database (mirrors the SoW's Aurora Postgres, p.147)
#   minio    -> S3-compatible object store standing in for the real media bucket
#   createbuckets -> one-shot: creates the bucket and makes it public-read so a
#                    CDN (CloudFront in production) can front it.
#
# Postgres is on 5433 because the host already runs Homebrew postgres on 5432.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: snapmart
      POSTGRES_PASSWORD: snapmart
      POSTGRES_DB: snapmart_cms
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U snapmart -d snapmart_cms']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: snapmart
      MINIO_ROOT_PASSWORD: snapmart123
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'   # S3 API      -> S3_ENDPOINT
      - '9001:9001'   # web console  -> http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 snapmart snapmart123;
      mc mb --ignore-existing local/snapmart-cms-media;
      mc anonymous set download local/snapmart-cms-media;
      echo 'bucket snapmart-cms-media ready (public-read)';
      "

volumes:
  pgdata:
  miniodata:
